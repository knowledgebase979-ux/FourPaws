# FourPaws has no npm dependencies (no package-lock.json), so there is no `npm ci` or npm cache step.
name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - run: npm test
    - run: npm run build
    - run: npm run validate
