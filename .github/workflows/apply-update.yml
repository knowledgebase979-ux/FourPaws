# One-time helper: extracts the uploaded FourPaws-update.zip on this branch only.
# It verifies the zip hash first, then commits the extracted files and removes the zip.
# Workflow files inside the zip are skipped (GITHUB_TOKEN cannot change workflows).
name: Apply FourPaws update zip

on:
  push:
    branches: [ "claude/stoic-gates-fscxjh" ]
    paths: [ ".github/workflows/apply-update.yml" ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify, extract and commit
        run: |
          echo "4f7cc2978ff246ed28771b45a65531190fe7feac683044ef94df31f8ba1f62da  FourPaws-update.zip" | sha256sum -c -
          unzip -o FourPaws-update.zip -x '.github/*'
          git rm -q FourPaws-update.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Apply FourPaws update: personal guide, comparison agent, verified content, teal design"
          git push
